# Compile this instance on a schedule, and open a pull request if anything moved
# (Semprini spec 6.2).
#
# Deliberately thin: install a pinned version, run one command, open a PR. Every decision
# — what changed, whether anything changed at all, what to deprecate — belongs to the CLI
# (spec 6.3). This workflow never pushes to main.
name: compile

on:
  schedule:
    # Monday morning, UTC. Any cadence works; a run that finds nothing writes nothing and
    # opens no pull request, so a frequent schedule costs only the run itself.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to the plane version that created this instance. Upgrading is a deliberate
      # edit to this line, reviewed like any other change (spec 7).
      - run: pip install semprini==%%version%%

      - run: semprini run
        # No adapter shipped with this version needs a credential: both read files already
        # in the repository. When one that calls an API does, it will name an environment
        # variable in config/semprini.yaml — never the value — and this step gains one line
        # per source pointing that name at a repository secret:
        #
        # env:
        #   SOME_API_TOKEN: ${{ secrets.SOME_API_TOKEN }}

      # The compile PR is opened with GITHUB_TOKEN, and GitHub fires no `pull_request`
      # event for those — so validate.yml does not run on it, and on a protected main the
      # required check would never report. Running the same command here is what keeps the
      # compiler's own output from being the one diff in this instance nobody validated.
      # Give the step below a PAT or app token instead if you would rather the check run on
      # the pull request itself; then this step is redundant and can go.
      #
      # `--base` is the commit this run started from: nothing has been committed yet, so
      # that is exactly the ID map as it stood before the compile (spec 6.1 check 6).
      - run: semprini check --base ${{ github.sha }}

      # The one platform-specific step, and the only shell in either workflow (spec 6.3).
      # It uses git and GitHub's own CLI rather than a third-party action: a shipped
      # workflow runs in every instance with write access to that organization's graph, and
      # an action referenced by a moving tag is code that changes without a diff anyone
      # reviews. Three of these lines are not obvious, and each is commented below.
      - name: Open a pull request
        # A run that changed nothing writes no report (spec 5.6), and the report is what
        # describes the pull request. Ungated, the quiet weeks are the ones the scheduled
        # job goes red on.
        if: hashFiles('generated/.report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # Handed to the shell as data rather than pasted into the script: a `${{ }}`
          # expression is substituted before the shell ever parses the line.
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          branch="compile/$today"

          # A runner has no committer identity of its own and `git commit` refuses without
          # one. This is the account the run is already acting as.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --create "$branch"
          git add generated mappings

          # Nothing staged means the compile changed nothing after all: no commit, no pull
          # request, and a green run rather than a failed one.
          if git diff --cached --quiet; then
            exit 0
          fi

          git commit --message "Compile $today"
          # Dispatched a second time on one day, the branch is already on the remote and
          # its pull request is open; force-pushing updates that pull request in place.
          git push --force origin "$branch"

          # ...and asking for a second pull request on the same branch is an error, so ask
          # only when there is none.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$BASE_BRANCH" --head "$branch" \
              --title "Compile $today" --body-file generated/.report.md
          fi
