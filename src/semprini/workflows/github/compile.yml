# Compile this instance on a schedule, and open a pull request if anything moved
# (Semprini spec 6.2).
#
# Deliberately thin: install a pinned version, run one command, open a PR. Every decision
# — what changed, whether anything changed at all, what to deprecate — belongs to the CLI
# (spec 6.3). This workflow never pushes to main.
name: compile

on:
  schedule:
    # Monday morning, UTC. Any cadence works; a run that finds nothing writes nothing and
    # opens no pull request, so a frequent schedule costs only the run itself.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to the plane version that created this instance. Upgrading is a deliberate
      # edit to this line, reviewed like any other change (spec 7).
      - run: pip install semprini==%%version%%

      - run: semprini run
        # Credentials reach the compiler as environment variables, named by each source's
        # `token_env` in config/semprini.yaml — never written into that file. Add one line
        # per configured source, and the matching repository secret:
        #
        # env:
        #   ELLIE_API_TOKEN: ${{ secrets.ELLIE_API_TOKEN }}

      - id: date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: compile/${{ steps.date.outputs.value }}
          title: "Compile ${{ steps.date.outputs.value }}"
          # The run's own report is the description: what is new, what changed, what was
          # deprecated, and which warnings were raised. A run that changed nothing does not
          # rewrite it — and produces no commit, so no pull request is opened either.
          body-path: generated/.report.md
          commit-message: "Compile ${{ steps.date.outputs.value }}"
          add-paths: |
            generated
            mappings
