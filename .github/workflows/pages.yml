name: Pages

# Publishes the hosting behind the w3id namespace (task A2). w3id.org stores no content:
# https://w3id.org/semprini/ontology redirects here, so this site being live is what
# makes the metamodel namespace resolve.
#
# The site is built from src/semprini/ontology/sem.ttl plus the frozen copies in
# ontology-archive/, and never committed, so there is no second copy of the current
# ontology to drift from the first. All of the logic lives in tools/build_site.py — spec
# 6.3 constrains the workflow templates instances port to other CI systems, not this
# repository's own build.
#
# Every version this has ever published must go on resolving: /ontology/X.Y.Z/ is a
# permanent identifier w3id.org redirects to (task G5). That is why the archive is a
# trigger path below and not merely an input — a release that freezes a version and does
# not redeploy leaves the path it just promised returning a 404.

on:
  push:
    branches: [main]
    paths:
      - src/semprini/ontology/sem.ttl
      - ontology-archive/**
      - tools/build_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a half-finished deployment of a permanent identifier's target.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installed rather than run from the source tree, so the version the site
      # publishes is read by the same code the compiler ships.
      - name: Install the package
        run: pip install .

      - name: Build the site
        run: python tools/build_site.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
